# CI foundation for RemoteAgent.
#
# Runs the same deterministic checks a developer runs locally. It installs only
# from the committed lockfile and never fetches secrets: base controls do not
# require any project credentials.
image: node:24.19.0-bookworm-slim

stages:
  - verify

variables:
  # Pinned package manager, activated via Corepack.
  PNPM_VERSION: "10.26.1"
  # Keep the pnpm content-addressable store inside the project for caching.
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"

# Shared setup: enable the pinned pnpm and install from the frozen lockfile.
.pnpm-setup: &pnpm-setup
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

lint:
  stage: verify
  <<: *pnpm-setup
  script:
    - pnpm run lint
    - pnpm run format

typecheck:
  stage: verify
  <<: *pnpm-setup
  script:
    - pnpm run typecheck

test:
  stage: verify
  <<: *pnpm-setup
  # A real PostgreSQL service backs the RA-003 integration gate. The image and
  # credentials mirror docker-compose.yml (non-secret local values). Inside CI
  # the service is reachable at host `postgres` on 5432 (no port remap needed).
  services:
    - name: postgres:17.2-alpine
      alias: postgres
  variables:
    POSTGRES_USER: remoteagent
    POSTGRES_PASSWORD: remoteagent-local-dev
    POSTGRES_DB: remoteagent
    # Point the persistence layer at the CI service.
    RA_PGHOST: postgres
    RA_PGPORT: "5432"
    RA_PGUSER: remoteagent
    RA_PGPASSWORD: remoteagent-local-dev
    RA_PGDATABASE: remoteagent
    # Fail closed: a missing/unreachable PostgreSQL must fail this gate, never
    # skip green (AUDIT-01 MEDIUM-03).
    RA_REQUIRE_POSTGRES: "1"
  script:
    # Preflight: fail fast if the database is unreachable.
    - pnpm --filter @remoteagent/database exec tsx scripts/require-postgres.ts
    - pnpm run test

build:
  stage: verify
  <<: *pnpm-setup
  script:
    - pnpm run build

workflow-validate:
  stage: verify
  <<: *pnpm-setup
  script:
    - pnpm run workflow:validate
