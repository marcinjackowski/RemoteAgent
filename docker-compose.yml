# Local infrastructure dependencies for development only.
#
# The credentials below are non-secret, local-only defaults. Real environments
# inject credentials out of band; nothing here is used in CI or production.
name: remoteagent-dev

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: remoteagent
      POSTGRES_PASSWORD: remoteagent-local-dev
      POSTGRES_DB: remoteagent
    ports:
      # Host port 5433 avoids colliding with a locally-installed PostgreSQL that
      # may already bind 5432. Inside the container PostgreSQL still listens on
      # 5432. Set RA_PGPORT=5433 (or RA_DATABASE_URL) to point tools/tests here.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remoteagent -d remoteagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
